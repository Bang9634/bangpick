[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bangpick-gpu-worker"
version = "0.1.0"
description = "Bootstrap entry point for the bangpick reconstruction worker"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bangpick-worker = "bangpick_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

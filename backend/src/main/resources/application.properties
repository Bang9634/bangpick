spring.application.name=bangpick-backend
server.servlet.context-path=/api
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:13306/bangpick}
spring.datasource.username=${DB_USERNAME:bangpick}
spring.datasource.password=${DB_PASSWORD:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# The transfer workflow is opt-in until account-based access is implemented.
bangpick.media.enabled=${BANGPICK_MEDIA_ENABLED:false}
spring.flyway.enabled=${BANGPICK_MEDIA_ENABLED:false}
bangpick.media.dev-token=${BANGPICK_MEDIA_DEV_TOKEN:}
bangpick.media.worker-token=${BANGPICK_MEDIA_WORKER_TOKEN:}
bangpick.media.recovery-token=${BANGPICK_MEDIA_RECOVERY_TOKEN:}
bangpick.media.namespace=${OCI_NAMESPACE:}
bangpick.media.bucket=${OCI_BUCKET:}
bangpick.media.region=${OCI_REGION:}
bangpick.media.config-file=${OCI_CONFIG_FILE:}
bangpick.media.profile=${OCI_CONFIG_PROFILE:DEFAULT}
